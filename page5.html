<!DOCTYPE html>
<html>

<head>
    <title>Exercise #2 - Images</title>
</head>

<body>

<h2>Images in Tables</h2>

<hr>

<h4>What are your favorite pets ?</h4>

<table border="1" >

<tr>
    <th>Pet Image</th>
    <th>More Facts about (as a Link)</th>
</tr>

<tr>
    <td>
        <img src="images (1).jpg" width="200" height="130">
    </td>
    <td>
        <a href="https://en.wikipedia.org/wiki/Horse">Horse</a>
    </td>
</tr>

<tr>
    <td>
        <img src="images (2).jpg" width="200" height="130">
    </td>
    <td>
        <a href="https://en.wikipedia.org/wiki/Dog">Dogs</a>
    </td>
</tr>

<tr>
    <td>
        <img src="images.jpg" width="200" height="100">
    </td>
    <td>
        <a href="https://en.wikipedia.org/wiki/Cat">Cats</a>
    </td>
</tr>

</table>

</body>

</html>
